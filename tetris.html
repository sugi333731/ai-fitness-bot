<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>テトリス風ゲーム</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111827;
      --panel: #1f2937;
      --text: #e5e7eb;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1f2937 0%, #0b1020 60%);
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--text);
    }

    .game-shell {
      display: grid;
      grid-template-columns: auto 220px;
      gap: 18px;
      align-items: start;
      padding: 16px;
      border-radius: 14px;
      background: rgba(17, 24, 39, 0.9);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    canvas {
      border: 2px solid #334155;
      border-radius: 8px;
      background: #020617;
      image-rendering: pixelated;
    }

    .panel {
      background: var(--panel);
      border-radius: 10px;
      padding: 14px;
      min-height: 100%;
      border: 1px solid #334155;
    }

    .panel h1 {
      font-size: 1.1rem;
      margin: 0 0 12px;
      color: #f8fafc;
    }

    .stat {
      margin: 8px 0;
      font-weight: 600;
    }

    .hint {
      margin-top: 14px;
      font-size: 0.9rem;
      line-height: 1.6;
      color: #cbd5e1;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #0f172a;
      background: linear-gradient(90deg, #67e8f9, #38bdf8);
    }

    button:hover {
      filter: brightness(1.05);
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <canvas id="board" width="300" height="600" aria-label="テトリス風ゲーム画面"></canvas>
    <aside class="panel">
      <h1>テトリス風ゲーム</h1>
      <div class="stat">スコア: <span id="score">0</span></div>
      <div class="stat">ライン: <span id="lines">0</span></div>
      <div class="stat">レベル: <span id="level">1</span></div>
      <button id="restart">リスタート</button>
      <p class="hint">
        ← → : 移動<br>
        ↓ : ソフトドロップ<br>
        ↑ / X : 回転<br>
        Z : 逆回転<br>
        Space : ハードドロップ
      </p>
    </aside>
  </div>

  <script>
    const COLS = 10;
    const ROWS = 20;
    const BLOCK = 30;

    const COLORS = {
      I: '#38bdf8',
      O: '#fde047',
      T: '#c084fc',
      S: '#4ade80',
      Z: '#f87171',
      J: '#60a5fa',
      L: '#fb923c'
    };

    const SHAPES = {
      I: [[1, 1, 1, 1]],
      O: [[1, 1], [1, 1]],
      T: [[0, 1, 0], [1, 1, 1]],
      S: [[0, 1, 1], [1, 1, 0]],
      Z: [[1, 1, 0], [0, 1, 1]],
      J: [[1, 0, 0], [1, 1, 1]],
      L: [[0, 0, 1], [1, 1, 1]]
    };

    const boardEl = document.getElementById('board');
    const ctx = boardEl.getContext('2d');
    const scoreEl = document.getElementById('score');
    const linesEl = document.getElementById('lines');
    const levelEl = document.getElementById('level');
    const restartBtn = document.getElementById('restart');

    let board;
    let piece;
    let score;
    let lines;
    let level;
    let gameOver;
    let dropCounter;
    let lastTime;

    function createBoard() {
      return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    }

    function randomType() {
      const keys = Object.keys(SHAPES);
      return keys[Math.floor(Math.random() * keys.length)];
    }

    function cloneShape(shape) {
      return shape.map(row => [...row]);
    }

    function spawnPiece() {
      const type = randomType();
      const shape = cloneShape(SHAPES[type]);
      piece = {
        x: Math.floor((COLS - shape[0].length) / 2),
        y: 0,
        shape,
        type
      };
      if (collides(piece.x, piece.y, piece.shape)) {
        gameOver = true;
      }
    }

    function collides(x, y, shape) {
      for (let row = 0; row < shape.length; row++) {
        for (let col = 0; col < shape[row].length; col++) {
          if (!shape[row][col]) continue;
          const nx = x + col;
          const ny = y + row;
          if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
          if (ny >= 0 && board[ny][nx]) return true;
        }
      }
      return false;
    }

    function mergePiece() {
      piece.shape.forEach((row, y) => {
        row.forEach((val, x) => {
          if (!val) return;
          const by = piece.y + y;
          if (by >= 0) board[by][piece.x + x] = piece.type;
        });
      });
    }

    function rotate(shape, dir = 1) {
      const h = shape.length;
      const w = shape[0].length;
      const rotated = Array.from({ length: w }, () => Array(h).fill(0));
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          if (dir > 0) rotated[x][h - 1 - y] = shape[y][x];
          else rotated[w - 1 - x][y] = shape[y][x];
        }
      }
      return rotated;
    }

    function tryRotate(dir) {
      const next = rotate(piece.shape, dir);
      const kicks = [0, -1, 1, -2, 2];
      for (const kick of kicks) {
        if (!collides(piece.x + kick, piece.y, next)) {
          piece.x += kick;
          piece.shape = next;
          return;
        }
      }
    }

    function clearLines() {
      let cleared = 0;
      for (let y = ROWS - 1; y >= 0; y--) {
        if (board[y].every(cell => cell)) {
          board.splice(y, 1);
          board.unshift(Array(COLS).fill(null));
          cleared++;
          y++;
        }
      }
      if (!cleared) return;

      lines += cleared;
      score += [0, 100, 300, 500, 800][cleared] * level;
      level = Math.floor(lines / 10) + 1;
      updateStats();
    }

    function updateStats() {
      scoreEl.textContent = String(score);
      linesEl.textContent = String(lines);
      levelEl.textContent = String(level);
    }

    function lockAndNext() {
      mergePiece();
      clearLines();
      spawnPiece();
    }

    function hardDrop() {
      if (gameOver) return;
      while (!collides(piece.x, piece.y + 1, piece.shape)) {
        piece.y++;
      }
      lockAndNext();
    }

    function stepDown() {
      if (gameOver) return;
      if (!collides(piece.x, piece.y + 1, piece.shape)) {
        piece.y++;
      } else {
        lockAndNext();
      }
    }

    function dropInterval() {
      return Math.max(120, 900 - (level - 1) * 80);
    }

    function drawCell(x, y, type) {
      const px = x * BLOCK;
      const py = y * BLOCK;
      ctx.fillStyle = COLORS[type];
      ctx.fillRect(px, py, BLOCK, BLOCK);
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      ctx.fillRect(px + 2, py + 2, BLOCK - 4, 6);
      ctx.strokeStyle = 'rgba(15,23,42,0.65)';
      ctx.lineWidth = 2;
      ctx.strokeRect(px + 1, py + 1, BLOCK - 2, BLOCK - 2);
    }

    function drawGrid() {
      ctx.strokeStyle = 'rgba(148,163,184,0.12)';
      for (let x = 0; x <= COLS; x++) {
        ctx.beginPath();
        ctx.moveTo(x * BLOCK, 0);
        ctx.lineTo(x * BLOCK, ROWS * BLOCK);
        ctx.stroke();
      }
      for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y * BLOCK);
        ctx.lineTo(COLS * BLOCK, y * BLOCK);
        ctx.stroke();
      }
    }

    function render() {
      ctx.clearRect(0, 0, boardEl.width, boardEl.height);
      drawGrid();
      board.forEach((row, y) => {
        row.forEach((cell, x) => {
          if (cell) drawCell(x, y, cell);
        });
      });

      if (piece && !gameOver) {
        piece.shape.forEach((row, y) => {
          row.forEach((val, x) => {
            if (val) drawCell(piece.x + x, piece.y + y, piece.type);
          });
        });
      }

      if (gameOver) {
        ctx.fillStyle = 'rgba(2,6,23,0.75)';
        ctx.fillRect(0, 0, boardEl.width, boardEl.height);
        ctx.fillStyle = '#f8fafc';
        ctx.textAlign = 'center';
        ctx.font = 'bold 36px sans-serif';
        ctx.fillText('GAME OVER', boardEl.width / 2, boardEl.height / 2 - 10);
        ctx.font = '16px sans-serif';
        ctx.fillText('リスタートで再挑戦', boardEl.width / 2, boardEl.height / 2 + 24);
      }
    }

    function update(time = 0) {
      if (!lastTime) lastTime = time;
      const delta = time - lastTime;
      lastTime = time;

      if (!gameOver) {
        dropCounter += delta;
        if (dropCounter >= dropInterval()) {
          dropCounter = 0;
          stepDown();
        }
      }

      render();
      requestAnimationFrame(update);
    }

    function resetGame() {
      board = createBoard();
      score = 0;
      lines = 0;
      level = 1;
      gameOver = false;
      dropCounter = 0;
      lastTime = 0;
      updateStats();
      spawnPiece();
    }

    document.addEventListener('keydown', (e) => {
      if (gameOver && e.code !== 'Space') return;
      if (!piece) return;

      switch (e.code) {
        case 'ArrowLeft':
          if (!collides(piece.x - 1, piece.y, piece.shape)) piece.x--;
          break;
        case 'ArrowRight':
          if (!collides(piece.x + 1, piece.y, piece.shape)) piece.x++;
          break;
        case 'ArrowDown':
          stepDown();
          score += 1;
          updateStats();
          break;
        case 'ArrowUp':
        case 'KeyX':
          tryRotate(1);
          break;
        case 'KeyZ':
          tryRotate(-1);
          break;
        case 'Space':
          hardDrop();
          break;
      }
    });

    restartBtn.addEventListener('click', resetGame);

    resetGame();
    requestAnimationFrame(update);
  </script>
</body>
</html>
